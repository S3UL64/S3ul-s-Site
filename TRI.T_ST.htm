    <!-- Styles -->
    <style>
        body {
            background-color: indigo;
            color: white;
            font-family: "Lucida Console", Times, monospace;
            display: flex;
            flex-direction: column;
            margin: 0;
            height: 100vh;
        }

        h2 {
            color: black;
        }

        .dropdown {
            position: relative;
            display: inline-block;
        }

        .dropdown-button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px;
            font-size: 24px;
            cursor: pointer;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: white;
            min-width: 160px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .dropdown-content a {
            color: black;
            padding: 12px 16px;
            text-decoration: none;
            display: block;
        }

        .dropdown-content a:hover {
            background-color: #f1f1f1;
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown:hover .dropdown-button {
            background-color: #3e8e41;
        }

        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        footer {
            text-align: center;
            padding: 10px;
            background-color: black;
            color: white;
        }
    </style>
